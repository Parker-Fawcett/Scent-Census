# Applies Prisma migrations to the production Neon database.
#
# Runs on every push to main, right after a merge deploys to production.
# `prisma migrate deploy` is idempotent and skips already-recorded migrations.
# The direct (non-pooler) endpoint is required, which is why DIRECT_URL is a
# repository secret: a local run can be impossible from a phone hotspot that
# black-holes outbound port 5432, while GitHub runners have full egress.
name: prod-migrate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prod-migrate
  cancel-in-progress: false

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: diagnose
        run: |
          echo "--- pooler resolution"
          dig +short ep-noisy-frog-b4b00sv3-pooler.c-6.us-east-2.aws.neon.tech
          echo "--- direct resolution"
          dig +short ep-noisy-frog-b4b00sv3.c-6.us-east-2.aws.neon.tech
          echo "--- per-IP probe: raw TCP + Postgres SSLRequest"
          node -e '
            const net = require("net");
            const sslreq = Buffer.from([0x00,0x00,0x08,0x04,0xd2,0x16,0x2f,0xa9]);
            async function probe(ip) {
              return new Promise(resolve => {
                const s = new net.Socket();
                const done = (msg) => { console.log(ip, "->", msg); s.destroy(); resolve(); };
                const timer = setTimeout(() => done("timeout, no reply"), 8000);
                s.connect(5432, ip, () => s.write(sslreq));
                s.on("data", d => {
                  clearTimeout(timer);
                  const label = d[0] === 83 ? "S (TLS accepted)" : "head " + d.toString("hex").slice(0, 8);
                  s.destroy(); resolve(console.log(ip, "->", label));
                });
                s.on("error", e => { clearTimeout(timer); done("error " + e.code); });
                s.on("close", () => { clearTimeout(timer); resolve(); });
              });
            }
            (async () => {
              for (const ip of ["52.95.251.153","52.14.39.200","77.112.100.143"]) await probe(ip);
            })();
          '
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - run: npx prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
