name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # build-time prerendering instantiates src/config.ts; placeholders here
      # are honest: they exist to satisfy boot, never to run against a DB
      - run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost/placeholder
          AUTH_SECRET: build-time-placeholder
